<!DOCTYPE html>
<html>
<head>
  <title>User Camera</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 20px;
      background: #1a1a1a;
      color: #fff;
    }
    .status-bar {
      background: #333;
      padding: 15px 20px;
      border-radius: 10px;
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      gap: 15px;
    }
    .status-indicator {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: #666;
      flex-shrink: 0;
    }
    .status-indicator.granted { background: #4CAF50; }
    .status-indicator.denied { background: #f44336; }
    .status-indicator.prompt { background: #FF9800; animation: pulse 1s infinite; }
    .status-indicator.connected { background: #4CAF50; animation: pulse 2s infinite; }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }
    .camera-badge {
      background: #2196F3;
      padding: 5px 12px;
      border-radius: 15px;
      font-size: 12px;
      font-weight: bold;
      flex-shrink: 0;
    }
    h2 { margin: 0 0 10px 0; }
    .permission-msg {
      background: #FF9800;
      color: #000;
      padding: 20px;
      border-radius: 10px;
      margin-bottom: 20px;
      display: none;
      text-align: center;
    }
    .permission-msg.show { display: block; }
    .enable-btn {
      background: #4CAF50;
      color: white;
      border: none;
      padding: 15px 30px;
      font-size: 18px;
      border-radius: 10px;
      cursor: pointer;
      display: none;
      margin: 20px auto;
      box-shadow: 0 4px 6px rgba(0,0,0,0.3);
    }
    .enable-btn:hover { background: #45a049; }
    .enable-btn:active { transform: scale(0.98); }
  </style>
</head>
<body>
  <div class="status-bar">
    <div id="status-indicator" class="status-indicator prompt"></div>
    <div>
      <div><strong>Camera Status:</strong> <span id="permission-text">Initializing...</span></div>
    </div>
    <div id="camera-badge" class="camera-badge" style="display: none;">FRONT</div>
  </div>

  <button id="enable-btn" class="enable-btn" onclick="enableCamera()">
    📷 Enable Camera
  </button>

  <div id="permission-msg" class="permission-msg">
    Tap the button above to enable camera access
  </div>
